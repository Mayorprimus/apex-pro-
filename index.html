<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Terminal | Institutional Terminal</title>
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Apex Terminal" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <script>
      // Service Worker disabled for debugging - enable after stable
      // if ('serviceWorker' in navigator) {
      //   window.addEventListener('load', () => {
      //     navigator.serviceWorker.register('/sw.js')
      //       .then(reg => console.log('Service Worker registered', reg))

      //   });
      // }
      console.log('Apex Terminal loading...');
      // Clear any stale caches
      if ('caches' in window) {
        caches.keys().then(names => names.forEach(name => caches.delete(name)));
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Fallback if React fails to mount -->
      <div id="fallback" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#020203;color:#fff;font-family:system-ui;padding:20px;text-align:center;">
        <div>
          <div style="font-size:3rem;margin-bottom:1rem;">⚡</div>
          <h1 style="font-size:1.5rem;margin-bottom:0.5rem;">Apex Terminal</h1>
          <p style="color:#888;font-size:0.9rem;">Loading financial terminal...</p>
          <p style="color:#666;font-size:0.75rem;margin-top:1rem;">If this persists, <a href="#" onclick="location.reload()" style="color:#6366f1;">refresh</a> or clear cache.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      console.log('Apex Terminal loading...');
      // Clear any stale caches
      if ('caches' in window) {
        caches.keys().then(names => names.forEach(name => caches.delete(name)));
      }
      // Hide fallback when React mounts (React clears root content on mount)
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        const fallback = document.getElementById('fallback');
        if (root && fallback && root.children.length === 0) {
          fallback.style.display = 'none';
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
  </body>
</html>
